# Push-to-talk modem path: the Pi writes VoicePacket lines to the ESP32, which puts
# them on LoRa without raising a hazard alert.
#   wokwi-cli --scenario tests/wokwi/ptt.test.yaml .
# The numbers are a real VoicePacket line (software.voice, 1 s of 220 Hz tone, Codec2 700C).
name: RakshaWave PTT - voice chunk over LoRa, no hazard alert
version: 1
steps:
  - wait-serial: 'RakshaWave node online.'
  - delay: 500ms
  - write-serial: [123, 34, 116, 34, 58, 34, 86, 79, 73, 67, 69, 34, 44, 34, 118, 101, 104, 34, 58, 34, 86, 69, 72, 45, 80, 73, 45, 48, 49, 34, 44, 34, 115, 105, 100, 34, 58, 34, 53, 53, 50, 53, 56, 53, 34, 44, 34, 113, 34, 58, 48, 44, 34, 101, 34, 58, 48, 44, 34, 99, 34, 58, 34, 55, 48, 48, 67, 34, 44, 34, 100, 34, 58, 34, 98, 112, 86, 106, 103, 71, 54, 86, 89, 52, 66, 117, 108, 87, 79, 81, 98, 112, 86, 106, 103, 71, 54, 86, 89, 52, 66, 117, 108, 87, 79, 65, 98, 112, 86, 106, 103, 71, 54, 86, 89, 53, 66, 117, 108, 87, 79, 65, 98, 112, 86, 106, 103, 71, 54, 86, 89, 52, 66, 117, 108, 87, 79, 65, 98, 112, 86, 106, 107, 71, 54, 86, 89, 52, 66, 117, 108, 87, 79, 65, 98, 112, 86, 106, 103, 71, 54, 86, 89, 52, 66, 117, 108, 87, 79, 81, 98, 112, 86, 106, 103, 71, 54, 86, 89, 52, 65, 61, 34, 44, 34, 104, 111, 112, 34, 58, 48, 44, 34, 109, 104, 34, 58, 48, 44, 34, 116, 116, 108, 34, 58, 49, 48, 46, 48, 125, 10]
  - delay: 400ms
