# One-click host on Render (free plan): New + > Blueprint > pick this repo.
services:
  - type: web
    name: rakshawave
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
