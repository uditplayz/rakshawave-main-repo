; RakshaWave ESP32-C3 firmware build (used by the Wokwi twin: see wokwi.toml)
[platformio]
src_dir = firmware/esp32
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial = UART0 (IO20/IO21), not native USB CDC.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    mikalhart/TinyGPSPlus
    sandeepmistry/LoRa
    bblanchon/ArduinoJson@^6

; Wokwi twin build: Serial over the C3's USB-Serial/JTAG. On the real board
; IO18/IO19 (USB D-/D+) are used for SPI and IO20/IO21 for the GPS, so this
; is a simulation-only workaround for the pin clash noted in hardware/HIL_VERIFICATION.md.
[env:wokwi]
extends = env:esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRW_DEBUG_IMU
