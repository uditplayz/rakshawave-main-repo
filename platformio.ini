; RakshaWave ESP32-C3 firmware build (used by the Wokwi twin: see wokwi.toml)
[platformio]
src_dir = firmware/esp32
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial = UART0 (IO20/IO21) through the board's USB-UART bridge; IO18/IO19
; are used for SPI, so native USB CDC is not available.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    mikalhart/TinyGPSPlus
    sandeepmistry/LoRa
    bblanchon/ArduinoJson@^6
